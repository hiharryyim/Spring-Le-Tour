      <stop offset="0" stop-color="#2C2C2C"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#gt)"/>
  <g opacity="0.12" fill="#A3A24A">
