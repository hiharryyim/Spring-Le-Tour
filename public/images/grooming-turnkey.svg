  <text x="800" y="712" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" fill="#C5C48A" opacity="0.95">California-assembled · ready to earn</text>
  <text x="800" y="770" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#FFFFFF" opacity="0.55">Real build photos coming soon</text>
